<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Testi</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="h-screen bg-slate-900 text-white font-sans flex flex-col justify-center items-center gap-8">
    <form>
        <div class="flex flex-col gap-2 w-64">
            <span class="text-sm font-medium text-gray-300">E-posta Adresi</span>
            <input type="text"
                class="px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500 focus:outline-none transition-all"
                placeholder="">
        </div>

        <div class="flex flex-col gap-2 w-64">
            <label for="password" class="text-sm font-medium text-gray-300">Şifreniz</label>
            <input type="password" id="password"
                class="px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:border-green-500 focus:ring-4 focus:ring-green-500 focus:outline-none transition-all">
        </div>
    </form>
</body>

</html>
